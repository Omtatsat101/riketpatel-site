<html lang="en">

<title>Riket B. Patel — Scan Card</title>
<meta name="description" content="Scan to open Riket B. Patel's digital contact card." />

<meta property="og:title" content="Riket B. Patel — Scan Card" />
<meta property="og:description" content="Scan the QR code to open my digital contact card." />

<style>
  :root {
    --forest: #1a3a2a;
    --gold: #b8860b;
    --paper: #faf6ec;
    --ink: #14201a;
    --muted: #6b7d70;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #23503a 0%, rgba(35,80,58,0) 60%),
      var(--forest);
    color: var(--paper);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .eyebrow {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.15;
    margin-bottom: 20px;
  }
  .qr-card {
    background: #ffffff;
    border-radius: 22px;
    padding: 26px;
    box-shadow: 0 22px 60px rgba(0,0,0,0.35);
    display: inline-block;
    width: 100%;
    max-width: 340px;
  }
  .qr-card svg {
    width: 100%;
    height: auto;
    display: block;
    shape-rendering: crispEdges;
  }
  .caption {
    margin-top: 16px;
    color: var(--paper);
  }
  .caption .scan {
    font-size: 14px;
    color: rgba(250,246,236,0.72);
    margin-bottom: 4px;
  }
  .caption .url {
    font-family: Georgia, serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.01em;
    word-break: break-word;
  }
  .caption .url a { color: var(--gold); text-decoration: none; }
  .actions {
    margin-top: 26px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .btn {
    appearance: none;
    border: 1px solid rgba(184,134,11,0.5);
    background: rgba(255,255,255,0.04);
    color: var(--paper);
    font-size: 14px;
    font-weight: 600;
    padding: 11px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.05s ease;
  }
  .btn:hover { background: rgba(184,134,11,0.16); border-color: var(--gold); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: #1a1205; }
  .btn.primary:hover { background: #caa020; }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .foot {
    margin-top: 22px;
    font-size: 12px;
    color: rgba(250,246,236,0.5);
  }
  .foot a { color: rgba(250,246,236,0.6); text-decoration: none; }

  /* Print: a clean, dark-on-white QR sized for a business card, chrome hidden. */
  @media print {
    @page { margin: 12mm; }
    body {
      background: #fff !important;
      color: #000 !important;
      display: block;
      padding: 0;
    }
    main { max-width: none; margin: 0 auto; }
    .eyebrow { color: #000; }
    h1 { color: #000; font-size: 20px; margin-bottom: 12px; }
    .qr-card {
      box-shadow: none;
      border: 1px solid #000;
      padding: 10px;
      max-width: 62mm;   /* ~2.4in — reliable scan size on a printed card */
    }
    .caption .scan { color: #333; }
    .caption .url { color: #000; }
    .caption .url a { color: #000; }
    .actions, .foot { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>

<script>
(function () {
  "use strict";
  var svg = document.getElementById("qr");
  var URLSTR = "https://riketpatel.com/card/";

  function serializeSvg() {
    var clone = svg.cloneNode(true);
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
  }

  function triggerDownload(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  var svgBtn = document.getElementById("dl-svg");
  if (svgBtn) svgBtn.addEventListener("click", function () {
    triggerDownload(new Blob([serializeSvg()], { type: "image/svg+xml" }), "riket-patel-card-qr.svg");
  });

  var pngBtn = document.getElementById("dl-png");
  if (pngBtn) pngBtn.addEventListener("click", function () {
    var SIZE = 2048; // high-res for print
    var svgData = serializeSvg();
    var img = new Image();
    var svgUrl = URL.createObjectURL(new Blob([svgData], { type: "image/svg+xml" }));
    img.onload = function () {
      var canvas = document.createElement("canvas");
      canvas.width = SIZE; canvas.height = SIZE;
      var ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, SIZE, SIZE);
      ctx.drawImage(img, 0, 0, SIZE, SIZE);
      URL.revokeObjectURL(svgUrl);
      canvas.toBlob(function (blob) {
        if (blob) triggerDownload(blob, "riket-patel-card-qr.png");
      }, "image/png");
    };
    img.onerror = function () { URL.revokeObjectURL(svgUrl); };
    img.src = svgUrl;
  });

  var printBtn = document.getElementById("print");
  if (printBtn) printBtn.addEventListener("click", function () { window.print(); });
})();
</script>
