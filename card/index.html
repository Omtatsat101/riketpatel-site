<style>
  :root {
    --forest: #1a3a2a;
    --forest-deep: #0d1f16;
    --forest-soft: #24503a;
    --gold: #b8860b;
    --gold-light: #d4a92a;
    --gold-fade: #fdf6e3;
    --paper: #faf6ec;
    --paper-alt: #f1ecdd;
    --ink: #181413;
    --ink-soft: #4a4239;
    --muted: #6d635c;
    --line: rgba(26, 58, 42, 0.14);
    --card-bg: #ffffff;
    --shadow-sm: 0 2px 8px rgba(26, 58, 42, 0.08);
    --shadow-md: 0 10px 28px rgba(26, 58, 42, 0.14);
    --shadow-lg: 0 20px 50px rgba(26, 58, 42, 0.20);
    --radius: 16px;
    --radius-lg: 22px;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(circle at 15% 0%, rgba(184, 134, 11, 0.10), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(26, 58, 42, 0.08), transparent 40%),
      var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  main {
    max-width: 460px;
    margin: 0 auto;
  }

  /* Personalized greeting */
  .greeting {
    text-align: center;
    font-family: var(--font-display);
    font-style: italic;
    color: var(--forest);
    font-size: 15px;
    margin: 4px 0 14px;
    padding: 8px 14px;
    background: rgba(184, 134, 11, 0.10);
    border-radius: 999px;
    display: inline-block;
    width: auto;
    max-width: 100%;
  }
  .greeting-wrap { text-align: center; }

  /* Header block */
  header.card-hero {
    text-align: center;
    padding: 6px 0 20px;
  }
  .avatar {
    width: 120px;
    height: 120px;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--gold);
    box-shadow: var(--shadow-md);
    background: var(--paper-alt);
    display: block;
    margin: 0 auto 14px;
  }
  h1.name {
    font-family: var(--font-display);
    font-size: 30px;
    line-height: 1.15;
    margin: 0 0 6px;
    color: var(--forest-deep);
    letter-spacing: -0.01em;
  }
  .tagline {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }
  .note {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
    margin: 8px auto 0;
    max-width: 340px;
  }

  /* Contact rows */
  .contact-block {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 6px 4px;
    margin: 18px 0 20px;
    box-shadow: var(--shadow-sm);
  }
  .contact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    color: var(--ink);
    text-decoration: none;
    border-radius: 12px;
    transition: background 0.15s ease;
    min-height: 48px;
  }
  .contact-row + .contact-row {
    border-top: 1px solid var(--line);
  }
  .contact-row:hover, .contact-row:focus-visible {
    background: var(--gold-fade);
    outline: none;
  }
  .contact-row:focus-visible {
    box-shadow: 0 0 0 2px var(--gold);
  }
  .contact-row .icon {
    flex: 0 0 22px;
    width: 22px;
    height: 22px;
    color: var(--forest);
  }
  .contact-row .icon svg { width: 100%; height: 100%; display: block; }
  .contact-row .val {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
  }

  /* Primary CTA */
  .cta-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 18px 22px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.01em;
    border: none;
    border-radius: var(--radius);
    text-decoration: none;
    box-shadow: 0 10px 24px rgba(184, 134, 11, 0.32), inset 0 -2px 0 rgba(0, 0, 0, 0.08);
    cursor: pointer;
    font-family: var(--font-body);
    transition: transform 0.12s ease, box-shadow 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .cta-primary:hover, .cta-primary:focus-visible {
    box-shadow: 0 14px 30px rgba(184, 134, 11, 0.40), inset 0 -2px 0 rgba(0, 0, 0, 0.10);
    outline: none;
    transform: translateY(-1px);
  }
  .cta-primary:active { transform: translateY(0); }
  .cta-primary svg { width: 22px; height: 22px; }
  .cta-hint {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin: 8px 0 0;
    letter-spacing: 0.02em;
  }

  /* Tabs grid */
  .tabs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 24px 0 28px;
  }
  @media (max-width: 340px) {
    .tabs { grid-template-columns: 1fr; }
  }
  .tab {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 8px;
    min-height: 120px;
    padding: 16px;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    text-decoration: none;
    color: var(--ink);
    box-shadow: var(--shadow-sm);
    transition: transform 0.14s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .tab:hover, .tab:focus-visible {
    border-color: var(--gold);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
    outline: none;
  }
  .tab-icon {
    width: 30px;
    height: 30px;
    color: var(--forest);
  }
  .tab-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 700;
    color: var(--forest-deep);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    line-height: 1.2;
  }
  .tab-title .arrow {
    width: 16px; height: 16px;
    color: var(--gold);
    flex: 0 0 16px;
  }
  .tab-sub {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }

  /* QR section */
  .qr-section {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 18px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
  }
  .qr-title {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    color: var(--forest-deep);
    margin: 0 0 12px;
  }
  .qr-holder {
    width: 200px;
    height: 200px;
    margin: 0 auto 10px;
    background: #ffffff;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-holder svg { width: 100%; height: 100%; display: block; }
  .qr-caption {
    color: var(--muted);
    font-size: 12px;
    margin: 4px 0 12px;
  }
  .qr-download {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    background: transparent;
    color: var(--forest);
    border: 1px solid var(--forest);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    font-family: var(--font-body);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .qr-download:hover, .qr-download:focus-visible {
    background: var(--forest);
    color: var(--paper);
    outline: none;
  }
  .qr-download svg { width: 14px; height: 14px; }

  footer.card-foot {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-top: 8px;
  }
  footer.card-foot a { color: var(--muted); text-decoration: none; }
  footer.card-foot a:hover { color: var(--forest); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .cta-primary:hover, .tab:hover { transform: none; }
  }

  /* Slightly larger name on wider phones */
  @media (min-width: 400px) {
    h1.name { font-size: 34px; }
    .avatar { width: 128px; height: 128px; }
  }
</style>
</head>

    for (var i = 0; i < dataList.length; i++) {

      for (var i = 0; i < dcdata[r].length; i++) dcdata[r][i] = 0xff & buffer.buffer[i + offset];

      var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
      var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
      var modPoly = rawPoly.mod(rsPoly);
      ecdata[r] = new Array(rsPoly.getLength() - 1);
      for (i = 0; i < ecdata[r].length; i++) { var modIndex = i + modPoly.getLength() - ecdata[r].length; ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0; }
    }

    var data = new Array(totalCodeCount), index = 0;
    for (i = 0; i < maxDcCount; i++) for (r = 0; r < rsBlocks.length; r++) if (i < dcdata[r].length) { data[index++] = dcdata[r][i]; }

  };

  var QRUtil = {
    PATTERN_POSITION_TABLE: [
      [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34],
      [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50],
      [6, 30, 54], [6, 32, 58], [6, 34, 62]
    ],
    G15: (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
    G18: (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK: (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1),
    getBCHTypeInfo: function (data) { var d = data << 10; while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15))); return ((data << 10) | d) ^ QRUtil.G15_MASK; },
    getBCHTypeNumber: function (data) { var d = data << 12; while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18))); return (data << 12) | d; },
    getBCHDigit: function (data) { var digit = 0; while (data != 0) { digit++; data >>>= 1; } return digit; },
    getPatternPosition: function (typeNumber) { return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1]; },
    getMask: function (maskPattern, i, j) {

        case QRMaskPattern.PATTERN001: return i % 2 == 0;
        case QRMaskPattern.PATTERN010: return j % 3 == 0;
        case QRMaskPattern.PATTERN011: return (i + j) % 3 == 0;

      for (col = 0; col < moduleCount; col++) for (row = 0; row < moduleCount - 6; row++) { if (qrCode.isDark(row, col) && !qrCode.isDark(row + 1, col) && qrCode.isDark(row + 2, col) && qrCode.isDark(row + 3, col) && qrCode.isDark(row + 4, col) && !qrCode.isDark(row + 5, col) && qrCode.isDark(row + 6, col)) lostPoint += 40; }

  function pickTypeNumber(text) {

    build: function (text) {

})();

// ============================================================
// Card page bootstrap: load config, render tabs, render QR,
// handle personalization query params, wire download.
// ============================================================
(function () {
  var CARD_URL = 'https://riketpatel.com/card/';

  var FALLBACK = {
    contact: {
      name: 'Riket B. Patel',
      phone: '+1 (267) 408-6295',
      phoneRaw: '+12674086295',
      email: 'Riketpatel@gmail.com',
      city: 'Edgewater Park, NJ',
      website: 'https://riketpatel.com'
    },
    tagline: 'Product · Growth · Real Estate · Applied AI',
    tabs: [
      { id: 'projects', title: 'My Projects', subtitle: 'Legacy Bridge Alliance Group', url: 'https://legacybridgealliancegroup.com' },
      { id: 'realestate', title: 'Real Estate Profile (NJ)', subtitle: 'Metta Realty Partners · HomeSmart affiliate', url: 'https://mettarealtypartners.com' },
      { id: 'inquire', title: 'Service Inquiry', subtitle: 'Contact form + calendar', url: 'https://riketpatel.com/connect/' },
      { id: 'career', title: 'My Career', subtitle: 'Portfolio and experience', url: 'https://riketpatel.com/' }
    ]
  };

  // Tiny SVG icon set for the four tabs
  var TAB_ICONS = {
    projects:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V7l9-4 9 4v14"/><path d="M9 21V12h6v9"/></svg>',
    realestate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3l9 7v11a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
    inquire:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    career:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-4V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M10 7V5h4v2"/></svg>'
  };
  var ARROW = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>';

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderTabs(tabs) {
    var host = document.getElementById('tabs');
    if (!host) return;
    var html = '';
    for (var i = 0; i < tabs.length; i++) {
      var t = tabs[i];
      var icon = TAB_ICONS[t.id] || TAB_ICONS.projects;
      html +=
        '<a class="tab" href="' + escapeHtml(t.url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + escapeHtml(t.title) + '">' +
          '<div class="tab-icon" aria-hidden="true">' + icon + '</div>' +
          '<div class="tab-title">' + escapeHtml(t.title) + ARROW + '</div>' +
          '<div class="tab-sub">' + escapeHtml(t.subtitle || '') + '</div>' +
        '</a>';
    }
    host.innerHTML = html;
  }

  function applyContact(c) {
    var save = document.getElementById('save-contact');
    if (save) save.setAttribute('href', 'riket-patel.vcf');
    var phone = document.getElementById('phone-val');
    var phoneRow = phone && phone.closest('a');
    if (phone) phone.textContent = c.phone;
    if (phoneRow && c.phoneRaw) phoneRow.setAttribute('href', 'tel:' + c.phoneRaw);
    var email = document.getElementById('email-val');
    var emailRow = email && email.closest('a');
    if (email) email.textContent = c.email;
    if (emailRow) emailRow.setAttribute('href', 'mailto:' + c.email);
    var city = document.getElementById('city-val');
    if (city) city.textContent = c.city;
    var tag = document.getElementById('tagline');
    if (tag && window.__CARD_TAGLINE__) tag.textContent = window.__CARD_TAGLINE__;
  }

  function personalize() {
    try {
      var params = new URLSearchParams(window.location.search || '');
      var to = params.get('to');
      var note = params.get('note');
      if (to) {
        var g = document.getElementById('greeting');
        var wrap = document.getElementById('greeting-wrap');
        if (g && wrap) {
          g.textContent = 'For ' + to + ' — great to meet you.';
          wrap.hidden = false;
        }
      }
      if (note) {
        var n = document.getElementById('note');
        if (n) {
          n.textContent = note;
          n.hidden = false;
        }
      }
    } catch (e) { /* ignore */ }
  }

  function buildQrSvg(text) {
    var qr = QRCode.build(text);
    var count = qr.getModuleCount();
    var margin = 2;                    // quiet-zone modules
    var total = count + margin * 2;
    // Build one solid path of all dark modules for compactness
    var d = '';
    for (var r = 0; r < count; r++) {
      for (var c = 0; c < count; c++) {
        if (qr.isDark(r, c)) {
          d += 'M' + (c + margin) + ' ' + (r + margin) + 'h1v1h-1z';
        }
      }
    }
    // Slight rounding via shape-rendering crispEdges for print quality
    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + total + ' ' + total + '" ' +
      'shape-rendering="crispEdges" role="img" aria-label="QR code linking to ' + escapeHtml(text) + '">' +
      '<rect width="' + total + '" height="' + total + '" fill="#ffffff"/>' +
      '<path d="' + d + '" fill="#1a3a2a"/>' +
      '</svg>';
    return svg;
  }

  function renderQr(text) {
    var holder = document.getElementById('qr-holder');
    if (!holder) return;
    try {
      holder.innerHTML = buildQrSvg(text);
    } catch (e) {
      holder.innerHTML = '<span style="font-size:12px;color:#6d635c">QR unavailable</span>';
      console.warn('QR render failed:', e);
    }
  }

  function wireQrDownload(text) {
    var btn = document.getElementById('qr-download');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var svg = buildQrSvg(text);
      var blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'riket-patel-qr.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 500);
    });
  }

  function boot(cfg) {
    if (cfg && cfg.tagline) window.__CARD_TAGLINE__ = cfg.tagline;
    var contact = (cfg && cfg.contact) || FALLBACK.contact;
    var tabs = (cfg && cfg.tabs) || FALLBACK.tabs;
    applyContact(contact);
    renderTabs(tabs);
    renderQr(CARD_URL);
    wireQrDownload(CARD_URL);
    personalize();
  }

  // Load config with graceful fallback
  fetch('config.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('config ' + r.status); return r.json(); })
    .then(boot)
    .catch(function () { boot(FALLBACK); });
})();
</script>
