  .om { font-size: 68px; line-height: 1; color: #d4a017; }

  .contact .site { color: #d4a017; font-weight: 700; }
  .right { flex: 0 0 auto; width: 600px; display: flex; flex-direction: column; align-items: center; }
  .qrcard { background: #ffffff; border-radius: 30px; padding: 44px; box-shadow: 0 30px 70px rgba(0,0,0,0.35); }
