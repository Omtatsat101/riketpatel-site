<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Riket B. Patel — Contacts</title>
<meta name="description" content="Private contacts dashboard, sourced from Gmail via Drive." />
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet" />
<script src="../config.js"></script>
<style>
  :root {
    --ink: #1a1a1a; --ink-soft: #333; --muted: #5a5a5a;
    --paper: #fbf8f0; --line: #d4cdb8; --accent: #1a3a2a; --highlight: #b8860b;
    --serif: "Source Serif 4", "Source Serif Pro", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
  header.topbar { position: sticky; top: 0; z-index: 10; background: rgba(251, 248, 240, 0.96); backdrop-filter: saturate(160%) blur(8px); border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header.topbar h1 { font-family: var(--serif); font-size: 18pt; font-weight: 700; margin: 0; }
  header.topbar a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 13px; margin-left: 16px; }
  header.topbar .meta { font-size: 11px; color: var(--muted); font-style: italic; }

  #gate { max-width: 460px; margin: 80px auto; padding: 40px; background: #fff; border-radius: 8px; box-shadow: 0 8px 24px rgba(34, 22, 10, 0.08); border: 1px solid var(--line); }
  #gate h2 { font-family: var(--serif); margin: 0 0 8px; font-size: 18pt; }
  #gate p { color: var(--muted); margin: 0 0 20px; }
  #gate input { display: block; width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid var(--line); border-radius: 4px; font-family: inherit; }
  #gate .actions { margin-top: 16px; display: flex; gap: 10px; }
  #gate button { background: var(--accent); color: #fff; border: none; padding: 9px 18px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; }
  #gate .error { color: #b00020; font-size: 13px; margin-top: 10px; }

  main { display: none; padding: 24px; max-width: 1600px; margin: 0 auto; }
  main.unlocked { display: block; }

  .setup-banner { background: #fdf6e3; border: 1px solid var(--highlight); border-radius: 4px; padding: 16px 20px; margin-bottom: 24px; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
  .setup-banner strong { color: var(--ink); }
  .setup-banner code { background: rgba(255,255,255,0.5); padding: 1px 6px; border-radius: 3px; font-size: 12px; }
  .setup-banner a { color: var(--accent); border-bottom: 1px dotted var(--line); text-decoration: none; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .stat-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .stat-card .value { font-family: var(--serif); font-size: 22pt; font-weight: 700; color: var(--accent); line-height: 1.2; margin-top: 2px; }
  .stat-card .sub { font-size: 11px; color: var(--muted); font-style: italic; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
  .toolbar input, .toolbar select { padding: 7px 12px; border: 1px solid var(--line); border-radius: 4px; font-size: 13px; background: #fff; font-family: inherit; }
  .toolbar input[type="search"] { min-width: 260px; }
  .toolbar label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

  .tag-cloud { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .tag-cloud .tag { background: #fff; color: var(--accent); border: 1px solid var(--line); padding: 3px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; font-weight: 600; }
  .tag-cloud .tag .count { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .tag-cloud .tag.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tag-cloud .tag.active .count { color: rgba(255,255,255,0.7); }

  table.contacts { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  table.contacts th { background: #fcfaf2; padding: 9px 12px; text-align: left; font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--line); position: sticky; top: 56px; cursor: pointer; }
  table.contacts th:hover { background: #f4eee2; }
  table.contacts th.sorted { color: var(--accent); }
  table.contacts td { padding: 9px 12px; border-bottom: 1px solid #f0eadc; font-size: 13px; vertical-align: top; }
  table.contacts tr:last-child td { border-bottom: 0; }
  table.contacts tr:hover { background: #fcfaf2; }
  table.contacts td.name { font-weight: 600; color: var(--ink); }
  table.contacts td.email { font-family: "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--accent); }
  table.contacts td.email a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--line); }
  table.contacts td.tags { font-size: 10px; }
  table.contacts td.tags .pill { display: inline-block; background: #fdf6e3; color: var(--accent); padding: 1px 6px; border-radius: 3px; margin: 1px 2px 1px 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  table.contacts td.count { font-family: var(--serif); font-weight: 600; color: var(--accent); text-align: right; }
  table.contacts td.date { font-size: 11.5px; color: var(--muted); font-style: italic; white-space: nowrap; }
  table.contacts td.notes { font-size: 11.5px; color: var(--ink-soft); font-style: italic; }

  .empty-state { padding: 60px 24px; text-align: center; color: var(--muted); font-style: italic; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
  .error-state { padding: 24px; background: #fde2e2; border: 1px solid #b00020; border-radius: 4px; color: #b00020; font-size: 13px; }
</style>
</head>
<body>

<section id="gate">
  <h2>📇 Contacts</h2>
  <p>Private. Enter the access code.</p>
  <form id="gate-form" autocomplete="off">
    <input type="password" id="gate-input" placeholder="Access code" autocomplete="off" required />
    <div class="actions">
      <button type="submit">Unlock</button>
      <a href="../" style="color:#5a5a5a;text-decoration:none;font-size:13px;padding:9px 14px;">← Back</a>
    </div>
    <p class="error" id="gate-error" style="display:none;">That's not the code.</p>
  </form>
</section>

<header class="topbar" id="topbar" style="display:none;">
  <h1>📇 Contacts</h1>
  <span class="meta" id="last-fetch"></span>
  <a href="../jobs/">Pipeline</a>
  <a href="../outreach/">Outreach</a>
  <a href="../admin/">🛠 Admin</a>
</header>

<main id="main">

  <div id="setup-banner" style="display:none;"></div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Search name, email, domain, notes…" />
    <label for="source-filter">Account</label>
    <select id="source-filter"><option value="all">All</option></select>
    <label for="sort">Sort by</label>
    <select id="sort">
      <option value="last_seen_at">Recency</option>
      <option value="msg_count">Message count</option>
      <option value="name">Name</option>
      <option value="domain">Domain</option>
    </select>
    <span style="font-size:11px;color:#5a5a5a;font-style:italic;margin-left:auto;">Source: <span id="source-label">Google Sheet via Apps Script</span></span>
  </div>

  <div class="tag-cloud" id="tag-cloud"></div>

  <div id="results"></div>
</main>

<script>
  var GATE_CODE = (window.RP_CONFIG && window.RP_CONFIG.JOBS_PIPELINE_PASSWORD) || 'Pipeline137';
  var GATE_KEY = 'rp_jobs_unlocked';

  function isUnlocked() { try { return localStorage.getItem(GATE_KEY) === '1'; } catch (e) { return false; } }
  function unlock() {
    try { localStorage.setItem(GATE_KEY, '1'); } catch (e) {}
    document.getElementById('gate').style.display = 'none';
    document.getElementById('topbar').style.display = 'flex';
    document.getElementById('main').classList.add('unlocked');
    loadContacts();
  }
  document.getElementById('gate-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = (document.getElementById('gate-input').value || '').trim();
    if (v === GATE_CODE) unlock();
    else document.getElementById('gate-error').style.display = 'block';
  });
  if (isUnlocked()) unlock();

  var CONTACTS = [];
  var FILTERED = [];
  var ACTIVE_TAG = null;
  var ACTIVE_SOURCE = 'all';
  var SORT = 'last_seen_at';
  var SORT_DIR = 'desc';

  function escapeHtml(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtDate(s) {
    if (!s) return '';
    var d = new Date(s);
    if (isNaN(d.getTime())) return String(s);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var dDate = new Date(d); dDate.setHours(0, 0, 0, 0);
    var diff = Math.round((today - dDate) / (24 * 3600 * 1000));
    if (diff === 0) return 'today';
    if (diff === 1) return 'yesterday';
    if (diff < 7) return diff + 'd ago';
    if (diff < 30) return Math.round(diff / 7) + 'w ago';
    if (diff < 365) return Math.round(diff / 30) + 'mo ago';
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
  }

  function showSetupBanner() {
    var html = '<strong>Set up the Gmail → Drive → contacts page sync:</strong><br/>'
      + '1. Create a Google Sheet in Drive named <code>Riket Contacts</code>, leave the first tab named <code>All Contacts</code>.<br/>'
      + '2. Install the Apps Script from <a href="https://github.com/Omtatsat101/riketpatel-site/blob/main/scripts/contacts/gmail-extractor.gs" target="_blank">scripts/contacts/gmail-extractor.gs</a> in your Gmail account, paste the Sheet URL into <code>SHEET_URL</code>, run <code>extractAndSync()</code>, then <code>setupDailyTrigger()</code>.<br/>'
      + '3. Deploy as a web app (Anyone access, Execute as Me) and copy the web app URL.<br/>'
      + '4. Paste the URL into <code>config.js → GOOGLE_CONTACTS_WEB_APP_URL</code>, commit, push. Refresh this page.<br/><br/>'
      + 'Full runbook: <a href="https://github.com/Omtatsat101/riketpatel-site/blob/main/scripts/contacts/SETUP.md" target="_blank">scripts/contacts/SETUP.md</a>';
    document.getElementById('setup-banner').className = 'setup-banner';
    document.getElementById('setup-banner').style.display = 'block';
    document.getElementById('setup-banner').innerHTML = html;
  }

  function renderStats() {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var dayMs = 86400 * 1000;
    var lastWeek = 0, lastMonth = 0, lastQuarter = 0;
    CONTACTS.forEach(function (c) {
      if (!c.last_seen_at) return;
      var diff = (today - new Date(c.last_seen_at)) / dayMs;
      if (diff <= 7) lastWeek++;
      if (diff <= 30) lastMonth++;
      if (diff <= 90) lastQuarter++;
    });
    var html = '';
    html += '<div class="stat-card"><div class="label">Total contacts</div><div class="value">' + CONTACTS.length + '</div><div class="sub">across all inboxes</div></div>';
    html += '<div class="stat-card"><div class="label">Last 7 days</div><div class="value">' + lastWeek + '</div><div class="sub">active recently</div></div>';
    html += '<div class="stat-card"><div class="label">Last 30 days</div><div class="value">' + lastMonth + '</div><div class="sub">warm relationships</div></div>';
    html += '<div class="stat-card"><div class="label">Last 90 days</div><div class="value">' + lastQuarter + '</div><div class="sub">current network</div></div>';
    document.getElementById('stats').innerHTML = html;
  }

  function renderTagCloud() {
    var tagCounts = {};
    CONTACTS.forEach(function (c) {
      (String(c.tags || '').split(',')).forEach(function (t) {
        var k = t.trim().toLowerCase();
        if (!k) return;
        tagCounts[k] = (tagCounts[k] || 0) + 1;
      });
    });
    var tags = Object.keys(tagCounts).sort(function (a, b) { return tagCounts[b] - tagCounts[a]; });
    var html = '<span class="tag ' + (ACTIVE_TAG === null ? 'active' : '') + '" data-tag="">All <span class="count">' + CONTACTS.length + '</span></span>';
    tags.forEach(function (t) {
      html += '<span class="tag ' + (ACTIVE_TAG === t ? 'active' : '') + '" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + ' <span class="count">' + tagCounts[t] + '</span></span>';
    });
    document.getElementById('tag-cloud').innerHTML = html;
    document.querySelectorAll('#tag-cloud .tag').forEach(function (el) {
      el.addEventListener('click', function () {
        var t = el.dataset.tag || null;
        ACTIVE_TAG = (t === ACTIVE_TAG || t === '') ? null : t;
        applyFilters();
      });
    });
  }

  function renderSourceFilter() {
    var sel = document.getElementById('source-filter');
    var sources = {};
    CONTACTS.forEach(function (c) { if (c.source_account) sources[c.source_account] = true; });
    var html = '<option value="all">All</option>';
    Object.keys(sources).sort().forEach(function (s) {
      html += '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>';
    });
    sel.innerHTML = html;
    sel.value = ACTIVE_SOURCE;
  }

  function renderTable() {
    if (FILTERED.length === 0) {
      document.getElementById('results').innerHTML = '<div class="empty-state">No contacts match the current filters.</div>';
      return;
    }
    var html = '<table class="contacts"><thead><tr>'
      + '<th data-sort="name">Name</th>'
      + '<th data-sort="email">Email</th>'
      + '<th data-sort="msg_count" style="text-align:right;">Msgs</th>'
      + '<th data-sort="last_seen_at">Last seen</th>'
      + '<th>Tags</th>'
      + '<th data-sort="source_account">Account</th>'
      + '<th>Notes</th>'
      + '</tr></thead><tbody>';
    FILTERED.forEach(function (c) {
      var tags = String(c.tags || '').split(',').filter(Boolean).map(function (t) {
        return '<span class="pill">' + escapeHtml(t.trim()) + '</span>';
      }).join('');
      html += '<tr>'
        + '<td class="name">' + escapeHtml(c.name || '—') + '</td>'
        + '<td class="email"><a href="mailto:' + escapeHtml(c.email) + '">' + escapeHtml(c.email) + '</a></td>'
        + '<td class="count">' + (c.msg_count || 0) + '</td>'
        + '<td class="date">' + fmtDate(c.last_seen_at) + '</td>'
        + '<td class="tags">' + tags + '</td>'
        + '<td class="date">' + escapeHtml(c.source_account || '') + '</td>'
        + '<td class="notes">' + escapeHtml(c.notes || '') + '</td>'
        + '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById('results').innerHTML = html;
    // Wire sort headers
    document.querySelectorAll('table.contacts th[data-sort]').forEach(function (th) {
      th.addEventListener('click', function () {
        var s = th.dataset.sort;
        if (SORT === s) SORT_DIR = SORT_DIR === 'desc' ? 'asc' : 'desc';
        else { SORT = s; SORT_DIR = (s === 'name' || s === 'email' || s === 'source_account') ? 'asc' : 'desc'; }
        document.getElementById('sort').value = SORT;
        applyFilters();
      });
    });
  }

  function applyFilters() {
    var q = (document.getElementById('q').value || '').toLowerCase().trim();
    var src = document.getElementById('source-filter').value;
    SORT = document.getElementById('sort').value;
    FILTERED = CONTACTS.filter(function (c) {
      if (ACTIVE_TAG) {
        var ts = String(c.tags || '').toLowerCase();
        if (ts.split(',').map(function (t) { return t.trim(); }).indexOf(ACTIVE_TAG) < 0) return false;
      }
      if (src !== 'all' && c.source_account !== src) return false;
      if (q) {
        var hay = (String(c.name || '') + ' ' + String(c.email || '') + ' ' + String(c.domain || '') + ' ' + String(c.notes || '') + ' ' + String(c.tags || '')).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    FILTERED.sort(function (a, b) {
      var va = a[SORT], vb = b[SORT];
      if (SORT === 'msg_count') { va = Number(va) || 0; vb = Number(vb) || 0; }
      if (va < vb) return SORT_DIR === 'desc' ? 1 : -1;
      if (va > vb) return SORT_DIR === 'desc' ? -1 : 1;
      return 0;
    });
    renderTable();
    renderTagCloud();
  }

  function loadContacts() {
    var cfg = window.RP_CONFIG || {};
    var url = cfg.GOOGLE_CONTACTS_WEB_APP_URL;
    if (!url || url.indexOf('REPLACE_') === 0 || url.indexOf('PASTE_') === 0) {
      showSetupBanner();
      document.getElementById('results').innerHTML = '<div class="empty-state">Run the setup steps above to populate this dashboard.</div>';
      return;
    }
    fetch(url)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        CONTACTS = data.contacts || [];
        document.getElementById('last-fetch').textContent = 'fetched ' + new Date(data.fetched_at || Date.now()).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
        document.getElementById('source-label').textContent = data.source_account ? ('Apps Script (' + data.source_account + ')') : 'Google Sheets via Apps Script';
        renderStats();
        renderTagCloud();
        renderSourceFilter();
        applyFilters();
      })
      .catch(function (e) {
        document.getElementById('results').innerHTML = '<div class="error-state">Failed to load contacts: ' + escapeHtml(e.message) + '<br/><br/>Check the <code>GOOGLE_CONTACTS_WEB_APP_URL</code> in config.js, or open the web app URL in a browser to debug.</div>';
        showSetupBanner();
      });
  }

  document.getElementById('q').addEventListener('input', applyFilters);
  document.getElementById('source-filter').addEventListener('change', function () { ACTIVE_SOURCE = this.value; applyFilters(); });
  document.getElementById('sort').addEventListener('change', applyFilters);
</script>

</body>
</html>
