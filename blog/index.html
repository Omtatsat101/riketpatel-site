<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Riket's Notes — Blog</title>
<meta name="description" content="Things I'm learning about product, AI, and building useful free stuff. Notes from Riket B. Patel." />
<link rel="canonical" href="https://riketpatel.com/blog/" />
<meta property="og:type" content="blog" />
<meta property="og:title" content="Riket's Notes" />
<meta property="og:description" content="Things I'm learning about product, AI, and building useful free stuff." />
<meta property="og:url" content="https://riketpatel.com/blog/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink: #1a1a1a; --ink-soft: #333; --muted: #5a5a5a;
    --paper: #fbf8f0; --line: #d4cdb8; --accent: #1a3a2a; --highlight: #b8860b;
    --serif: "Source Serif 4", "Source Serif Pro", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 12pt; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  header.site { background: #fff; border-bottom: 1px solid var(--line); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  header.site a.brand { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; font-family: var(--sans); }
  header.site nav a { color: var(--muted); text-decoration: none; font-size: 14px; margin-left: 18px; font-family: var(--sans); }
  header.site nav a:hover { color: var(--accent); }

  main { max-width: 760px; margin: 0 auto; padding: 56px 24px 80px; }
  .blog-h { padding-bottom: 24px; border-bottom: 2px solid var(--ink); margin-bottom: 32px; }
  .blog-h h1 { font-family: var(--serif); font-size: 32pt; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 8px; line-height: 1.1; }
  .blog-h p.tagline { font-size: 14pt; color: var(--ink-soft); margin: 0 0 0; font-style: italic; }

  ul.posts { list-style: none; margin: 0; padding: 0; }
  ul.posts li { padding: 26px 0; border-bottom: 1px solid var(--line); }
  ul.posts li:last-child { border-bottom: 0; }

  .post-link { display: block; text-decoration: none; color: inherit; }
  .post-link:hover h2 { color: var(--accent); text-decoration: underline; }
  .post-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); font-family: var(--sans); margin-bottom: 8px; }
  .post-meta .date { font-style: italic; }
  .post-meta .reading-time::before { content: "·"; margin-right: 12px; color: var(--line); }
  .post-meta .tags { display: flex; gap: 6px; margin-left: auto; }
  .post-meta .tag { background: #fdf6e3; color: var(--accent); padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
  .post-link h2 { font-family: var(--serif); font-size: 22pt; font-weight: 700; margin: 0 0 8px; line-height: 1.25; }
  .post-link .subtitle { font-size: 13pt; color: var(--ink-soft); font-style: italic; margin: 0 0 12px; }
  .post-link .excerpt { font-size: 12pt; color: var(--ink-soft); line-height: 1.62; margin: 0; }
  .post-link .read-more { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--accent); font-weight: 600; font-family: var(--sans); }

  .empty { padding: 80px 0; text-align: center; color: var(--muted); font-style: italic; }
  footer { padding: 24px; text-align: center; font-size: 11px; color: var(--muted); font-style: italic; font-family: var(--sans); }
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="../">← Riket B. Patel</a>
  <nav>
    <a href="../">Home</a>
    <a href="../#professional">Professional</a>
    <a href="../connect/">Get in touch</a>
  </nav>
</header>

<main>
  <div class="blog-h">
    <h1 id="blog-title">Riket's Notes</h1>
    <p class="tagline" id="blog-tagline">Loading…</p>
  </div>

  <ul class="posts" id="post-list"><li class="empty">Loading posts…</li></ul>
</main>

<footer>
  <span>Notes from Edgewater Park, NJ.</span> · Hari Om Tat Sat.
</footer>

<script>
  function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(s) {
    if (!s) return '';
    var d = new Date(s + 'T00:00:00');
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  fetch('../data/blog-posts.json?v=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var site = data.site || {};
      if (site.title) document.getElementById('blog-title').textContent = site.title;
      if (site.tagline) document.getElementById('blog-tagline').textContent = site.tagline;

      var posts = (data.posts || []).filter(function (p) { return p.published !== false; });
      posts.sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });

      if (posts.length === 0) {
        document.getElementById('post-list').innerHTML = '<li class="empty">No posts yet. Coming soon.</li>';
        return;
      }
      var html = '';
      posts.forEach(function (p) {
        var url = p.url || ('/blog/' + p.slug + '/');
        var tags = (p.tags || []).map(function (t) { return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('');
        html += '<li>'
          + '<a class="post-link" href="' + url + '">'
          + '<div class="post-meta">'
          + '<span class="date">' + fmtDate(p.date) + '</span>'
          + (p.reading_time_min ? '<span class="reading-time">' + p.reading_time_min + ' min read</span>' : '')
          + '<span class="tags">' + tags + '</span>'
          + '</div>'
          + '<h2>' + escapeHtml(p.title) + '</h2>'
          + (p.subtitle ? '<p class="subtitle">' + escapeHtml(p.subtitle) + '</p>' : '')
          + (p.excerpt ? '<p class="excerpt">' + escapeHtml(p.excerpt) + '</p>' : '')
          + '<span class="read-more">Read it →</span>'
          + '</a>'
          + '</li>';
      });
      document.getElementById('post-list').innerHTML = html;
    })
    .catch(function (e) {
      document.getElementById('post-list').innerHTML = '<li class="empty">Failed to load posts: ' + e.message + '</li>';
    });
</script>

</body>
</html>
